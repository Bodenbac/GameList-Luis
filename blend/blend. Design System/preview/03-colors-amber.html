<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-base); font-family: var(--font-body); padding: 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .sw { border-radius: 14px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; min-height: 100px; box-shadow: var(--shadow-card); border: 1px solid var(--border-subtle); }
  .name { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  .hex  { font-family: var(--font-mono); font-size: 11px; opacity: 0.9; }
  .var  { font-family: var(--font-mono); font-size: 10px; opacity: 0.75; margin-top: 4px; }
  .role { font-size: 10px; opacity: 0.7; font-style: italic; margin-top: 6px; }
</style></head><body>
<div class="grid">
  <div class="sw" style="background: var(--amber-500); color: #fff; border-color: transparent;">
    <span class="name">Amber 500</span>
    <div><span class="hex">#E07B39</span><div class="var">--amber-500</div><div class="role">cart badge · accents</div></div>
  </div>
  <div class="sw" style="background: var(--amber-100); color: var(--green-900); border-color: transparent;">
    <span class="name">Amber 100</span>
    <div><span class="hex">#FAE5D3</span><div class="var">--amber-100</div><div class="role">soft tint · reserved</div></div>
  </div>
</div>
</body></html>

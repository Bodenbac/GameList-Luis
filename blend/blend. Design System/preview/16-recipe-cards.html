<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-base); padding: 28px 22px; font-family: var(--font-body); }
  .row { display: flex; gap: 12px; }
  .recipe-card { width: 196px; background: var(--bg-surface); border: 2px solid var(--border-subtle); border-radius: 20px; box-shadow: var(--shadow-card); padding: 14px 16px; }
  .recipe-card.loaded { border-color: var(--green-700); }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
  .name { font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--text-primary); line-height: 1.25; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
  .check { font-size: 11px; font-weight: 700; line-height: 9px; color: var(--green-700); margin-top: 4px; flex-shrink: 0; }
  .div { height: 1px; background: var(--border-subtle); margin-bottom: 8px; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
  li { font-size: 11px; color: var(--text-muted); line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .loaded li { color: var(--green-700); opacity: 0.75; }
</style></head><body>
<div class="row">
  <div class="recipe-card">
    <div class="top"><span class="name">Green Glow</span><span class="dot" style="background:#4A9B6F;"></span></div>
    <div class="div"></div>
    <ul><li>Babyspinat oder TK-Spinat</li><li>Bananen</li><li>Äpfel</li><li>Zitronen oder Limetten</li></ul>
  </div>
  <div class="recipe-card loaded">
    <div class="top"><span class="name">Berry Protein</span><span class="check">✓</span></div>
    <div class="div"></div>
    <ul><li>TK-Beerenmix</li><li>Bananen</li><li>Skyr oder Naturjoghurt</li><li>Milch oder Hafermilch</li><li>Haferflocken</li></ul>
  </div>
  <div class="recipe-card">
    <div class="top"><span class="name">Mango Karotte</span><span class="dot" style="background:#E07B39;"></span></div>
    <div class="div"></div>
    <ul><li>TK-Mango oder TK-Ananas</li><li>Karotten</li><li>Bananen</li><li>Ingwer</li></ul>
  </div>
</div>
</body></html>

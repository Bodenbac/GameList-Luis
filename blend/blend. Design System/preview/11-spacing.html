<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-base); padding: 24px; font-family: var(--font-body); }
  .row { display: flex; gap: 16px; align-items: center; }
  .bar { background: var(--green-700); height: 28px; border-radius: 4px; }
  .stack { display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .lbl  { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
  .lbl b { color: var(--text-primary); font-weight: 600; }
</style></head><body>
<div class="stack">
  <div class="lbl"><b>4</b><span>--space-1</span></div>
  <div class="bar" style="width:4px;"></div>
  <div class="lbl"><b>8</b><span>--space-2</span></div>
  <div class="bar" style="width:8px;"></div>
  <div class="lbl"><b>12</b><span>--space-3</span></div>
  <div class="bar" style="width:12px;"></div>
  <div class="lbl"><b>16</b><span>--space-4</span></div>
  <div class="bar" style="width:16px;"></div>
  <div class="lbl"><b>20</b><span>--space-5</span></div>
  <div class="bar" style="width:20px;"></div>
  <div class="lbl"><b>24</b><span>--space-6</span></div>
  <div class="bar" style="width:24px;"></div>
  <div class="lbl"><b>28</b><span>--space-7</span></div>
  <div class="bar" style="width:28px;"></div>
</div>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: rgba(26,51,40,.45); padding: 0; font-family: var(--font-body); min-height: 360px; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { width: 440px; background: var(--bg-surface); border-radius: 22px 22px 0 0; padding: 28px 20px 20px; display: flex; flex-direction: column; gap: 10px; }
  .t { font-family: var(--font-display); font-size: 19px; font-weight: 600; color: var(--text-primary); text-align: center; margin-bottom: 6px; }
  .opt { min-height: 60px; border-radius: 14px; background: var(--bg-muted); display: flex; align-items: center; gap: 14px; padding: 14px 16px; text-align: left; border: 1.5px solid transparent; cursor: pointer; }
  .opt:hover { background: var(--green-50); border-color: var(--green-100); }
  .ic { font-size: 24px; }
  .tl { font-size: 14px; font-weight: 600; color: var(--text-primary); }
  .ds { font-size: 12px; font-weight: 300; color: var(--text-muted); }
  .cancel { height: 44px; border-radius: 12px; font-size: 14px; font-weight: 500; color: var(--text-muted); background: transparent; border: 1px solid var(--border-subtle); margin-top: 2px; cursor: pointer; }
</style></head><body>
<div class="sheet">
  <p class="t">Einkaufszettel teilen</p>
  <button class="opt"><span class="ic">🥤</span><div><div class="tl">Nach Smoothie aufgeteilt</div></div></button>
  <button class="opt"><span class="ic">📋</span><div><div class="tl">Gesamter Einkaufszettel</div></div></button>
  <button class="cancel">Abbrechen</button>
</div>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-base); font-family: var(--font-body); padding: 24px; }
  .row { display: flex; gap: 12px; }
  .sw { flex: 1; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; min-height: 140px; box-shadow: var(--shadow-card); }
  .name { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  .hex  { font-family: var(--font-mono); font-size: 11px; opacity: 0.9; }
  .var  { font-family: var(--font-mono); font-size: 10px; opacity: 0.75; margin-top: 4px; }
</style></head><body>
<div class="row">
  <div class="sw" style="background: var(--green-900); color: var(--text-on-green);">
    <span class="name">Green 900</span>
    <div><span class="hex">#1A3328</span><div class="var">--green-900</div></div>
  </div>
  <div class="sw" style="background: var(--green-700); color: var(--text-on-green);">
    <span class="name">Green 700</span>
    <div><span class="hex">#2C5441</span><div class="var">--green-700</div></div>
  </div>
  <div class="sw" style="background: var(--green-500); color: var(--text-on-green);">
    <span class="name">Green 500</span>
    <div><span class="hex">#3D7A5E</span><div class="var">--green-500</div></div>
  </div>
  <div class="sw" style="background: var(--green-100); color: var(--green-900);">
    <span class="name">Green 100</span>
    <div><span class="hex">#D4EBE1</span><div class="var">--green-100</div></div>
  </div>
  <div class="sw" style="background: var(--green-50); color: var(--green-900);">
    <span class="name">Green 50</span>
    <div><span class="hex">#EAF5EE</span><div class="var">--green-50</div></div>
  </div>
</div>
</body></html>

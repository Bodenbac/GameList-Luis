<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-base); padding: 28px 22px; font-family: var(--font-body); }
  .row { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  .grp { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .cap { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
  .amber { background: var(--amber-500); color: #fff; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; }
  .green { background: var(--green-700); color: var(--text-on-green); padding: 3px 11px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .dot { width: 9px; height: 9px; border-radius: 50%; }
  .ckk { color: var(--green-700); font-weight: 700; font-size: 14px; }
</style></head><body>
<div class="row">
  <div class="grp"><span class="amber">3</span><span class="cap">cart-badge · amber</span></div>
  <div class="grp"><span class="amber">12</span><span class="cap">cart-badge · 2-digit</span></div>
  <div class="grp"><span class="green">7</span><span class="cap">count-badge · green</span></div>
  <div class="grp"><span class="dot" style="background:#4A9B6F;"></span><span class="cap">recipe-dot</span></div>
  <div class="grp"><span class="dot" style="background:#E07B39;"></span><span class="cap">recipe-dot</span></div>
  <div class="grp"><span class="dot" style="background:#9B6EA8;"></span><span class="cap">recipe-dot</span></div>
  <div class="grp"><span class="ckk">✓</span><span class="cap">loaded check</span></div>
</div>
</body></html>

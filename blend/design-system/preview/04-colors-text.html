<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-base); font-family: var(--font-body); padding: 28px; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 10px 14px; background: var(--bg-surface); border-radius: 12px; border: 1px solid var(--border-subtle); }
  .label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; width: 110px; flex-shrink: 0; }
  .specimen { flex: 1; font-size: 16px; font-weight: 500; }
  .meta { font-family: var(--font-mono); font-size: 10px; opacity: 0.65; }
</style></head><body>
<div class="stack">
  <div class="row"><span class="label" style="color: var(--text-primary);">Primary</span><span class="specimen" style="color: var(--text-primary);">Sattmacher Shake</span><span class="meta">#1A3328</span></div>
  <div class="row"><span class="label" style="color: var(--text-body);">Body</span><span class="specimen" style="color: var(--text-body);">Skyr oder Naturjoghurt</span><span class="meta">#3D4F46</span></div>
  <div class="row"><span class="label" style="color: var(--text-muted);">Muted</span><span class="specimen" style="color: var(--text-muted);">1 große Packung</span><span class="meta">#7A9089</span></div>
  <div class="row" style="background: var(--green-700);"><span class="label" style="color: var(--text-on-green);">On-green</span><span class="specimen" style="color: var(--text-on-green);">Einkaufszettel</span><span class="meta" style="color: var(--text-on-green); opacity:0.6;">#F7F4EF</span></div>
</div>
</body></html>

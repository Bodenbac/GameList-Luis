<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-base); padding: 24px; font-family: var(--font-body); color: var(--green-900); }
  .stack { display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; align-items: baseline; gap: 14px; }
  .w { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); width: 60px; }
  .s { color: var(--text-primary); }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: 12px; }
</style></head><body>
<div class="stack">
  <div class="row"><span class="w">300</span><span class="s" style="font-weight:300; font-size:18px;">8–10 Stück Bananen, langsam reifend.</span></div>
  <div class="row"><span class="w">400</span><span class="s" style="font-weight:400; font-size:18px;">8–10 Stück Bananen, langsam reifend.</span></div>
  <div class="row"><span class="w">500</span><span class="s" style="font-weight:500; font-size:18px;">8–10 Stück Bananen, langsam reifend.</span></div>
  <div class="row"><span class="w">600</span><span class="s" style="font-weight:600; font-size:18px;">8–10 Stück Bananen, langsam reifend.</span></div>
  <div class="row"><span class="w">300i</span><span class="s" style="font-weight:300; font-style: italic; font-size:18px;">Noch nichts ausgewählt.</span></div>
</div>
<div class="meta">DM SANS · 300 / 400 / 500 / 600 + italic 300</div>
</body></html>

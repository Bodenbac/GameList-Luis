<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: linear-gradient(180deg, var(--bg-base) 60%, var(--green-100)); padding: 0; font-family: var(--font-body); min-height: 200px; }
  .header { height: 64px; background: var(--bg-overlay); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-bottom: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: space-between; padding: 0 28px; }
  .left { display: flex; align-items: center; gap: 10px; }
  .wm { font-family: var(--font-display); font-weight: 700; font-size: 23px; color: var(--green-900); letter-spacing: -0.5px; }
  .ib { width: 38px; height: 38px; border-radius: 50%; background: var(--bg-muted); color: var(--text-body); display: inline-flex; align-items: center; justify-content: center; border: none; }
  .cb { position: relative; width: 40px; height: 40px; border-radius: 50%; background: var(--green-700); color: var(--text-on-green); display: inline-flex; align-items: center; justify-content: center; border: none; }
  .badge { position: absolute; top: -5px; right: -5px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: var(--amber-500); color: #fff; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
  .body { padding: 36px 28px; color: var(--text-muted); font-size: 12px; }
</style></head><body>

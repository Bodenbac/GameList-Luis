<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-base); padding: 24px; font-family: var(--font-body); color: var(--text-primary); }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .ex { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 14px; padding: 14px 16px; display: flex; gap: 14px; align-items: baseline; box-shadow: var(--shadow-card); }
  .tag { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; width: 90px; flex-shrink: 0; }
  .copy { font-size: 14px; font-weight: 500; }
  .eyebrow { font-family: var(--font-body); font-size: 11px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-muted); }
</style></head><body>
<div class="stack">
  <div class="ex"><span class="tag">Eyebrow</span><span class="eyebrow">Inspiration</span></div>
  <div class="ex"><span class="tag">Empty state</span><span class="copy" style="font-weight: 300; font-style: italic; color: var(--text-muted);">Noch nichts ausgewählt.</span></div>
  <div class="ex"><span class="tag">Modal title</span><span class="copy" style="font-family: var(--font-display); font-weight: 600; font-size: 19px;">Einkaufszettel teilen</span></div>
  <div class="ex"><span class="tag">Button</span><span class="copy" style="font-size: 14px; font-weight: 600;">Zurücksetzen</span></div>
  <div class="ex"><span class="tag">Quantity</span><span class="copy" style="font-weight: 300; color: var(--text-muted); font-size: 12px;">8–10 Stück  ·  1 große Packung  ·  1 kleines Stück</span></div>
  <div class="ex"><span class="tag">Aria-label</span><span class="copy" style="font-style: italic; color: var(--text-muted); font-size: 12px;">"Bananen entfernen"</span></div>
</div>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg-base); padding: 24px; font-family: var(--font-body); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .card { display: flex; flex-direction: column; padding: 13px 14px; min-height: 90px; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 14px; box-shadow: var(--shadow-card); position: relative; }
  .card.selected { background: var(--green-100); border-color: var(--green-700); }
  .emoji { font-size: 22px; line-height: 1; margin-bottom: 6px; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
  .name { font-size: 13px; font-weight: 600; color: var(--text-primary); line-height: 1.3; }
  .amt  { font-size: 11px; font-weight: 300; color: var(--text-muted); margin-top: 5px; }
  .chk  { font-size: 12px; font-weight: 600; color: var(--green-700); }
</style></head><body>
<div class="grid">
  <div class="card">
    <span class="emoji">🍌</span>
    <div class="top"><span class="name">Bananen</span></div>
    <span class="amt">8–10 Stück</span>
  </div>
  <div class="card selected">
    <span class="emoji">🥛</span>
    <div class="top"><span class="name">Milch oder Hafermilch</span><span class="chk">✓</span></div>
    <span class="amt">1–2 Liter</span>
  </div>
  <div class="card">
    <span class="emoji">🫐</span>
    <div class="top"><span class="name">TK-Beerenmix</span></div>
    <span class="amt">1 große Packung</span>
  </div>
  <div class="card selected">
    <span class="emoji">🌾</span>
    <div class="top"><span class="name">Haferflocken</span><span class="chk">✓</span></div>
    <span class="amt">1 Packung</span>
  </div>
</div>
</body></html>

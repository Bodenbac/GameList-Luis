<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>blend. — Smoothie Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-base:      #F7F4EF;
      --bg-surface:   #FFFFFF;
      --bg-muted:     #EEE9E1;
      --bg-overlay:   rgba(247, 244, 239, 0.92);

      --green-900:    #1A3328;
      --green-700:    #2C5441;
      --green-500:    #3D7A5E;
      --green-100:    #D4EBE1;
      --green-50:     #EAF5EE;

      --amber-500:    #E07B39;
      --amber-100:    #FAE5D3;

      --text-primary: #1A3328;
      --text-body:    #3D4F46;
      --text-muted:   #7A9089;
      --text-on-green:#F7F4EF;

      --border-subtle: rgba(26, 51, 40, 0.10);
      --border-strong: rgba(26, 51, 40, 0.22);

      --shadow-card:  0 2px 12px rgba(26, 51, 40, 0.07);
      --shadow-lift:  0 8px 32px rgba(26, 51, 40, 0.14);
      --shadow-panel: 0 4px 40px rgba(26, 51, 40, 0.10);

      --font-display: 'Playfair Display', Georgia, serif;
      --font-body:    'DM Sans', system-ui, sans-serif;
    }

    @keyframes card-select {
      0%   { transform: scale(1); }
      30%  { transform: scale(0.96); }
      70%  { transform: scale(1.02); }
      100% { transform: scale(1); }
    }
    @keyframes badge-pop {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.35); }
      100% { transform: scale(1); }
    }
    @keyframes badge-enter {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    @keyframes slide-in {
      from { transform: translateX(18px); opacity: 0; }
      to   { transform: translateX(0);    opacity: 1; }
    }
    @keyframes slide-out {
      from { transform: translateX(0);    opacity: 1; }
      to   { transform: translateX(18px); opacity: 0; }
    }
    @keyframes cart-shake {
      0%, 100% { transform: rotate(0deg); }
      25%      { transform: rotate(-7deg); }
      75%      { transform: rotate(7deg); }
    }
    @keyframes page-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes stagger-in {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      background: var(--bg-base);
      color: var(--text-body);
      min-height: 100vh;
      animation: page-in 350ms ease forwards;
    }

    button { cursor: pointer; border: none; font: inherit; background: none; }

    /* ── Header ── */
    .site-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 64px;
      background: var(--bg-overlay);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border-subtle);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
    }

    .wordmark {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 23px;
      color: var(--green-900);
      text-decoration: none;
      letter-spacing: -0.5px;
    }

    .cart-btn {
      position: relative;
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--green-700);
      color: var(--text-on-green);
      display: flex; align-items: center; justify-content: center;
      transition: background 150ms ease;
    }
    .cart-btn:hover { background: var(--green-500); }
    .cart-btn.shaking { animation: cart-shake 280ms ease; }
    .cart-btn svg { width: 19px; height: 19px; }

    .cart-badge {
      position: absolute;
      top: -5px; right: -5px;
      min-width: 20px; height: 20px;
      padding: 0 5px;
      border-radius: 999px;
      background: var(--amber-500);
      color: #fff;
      font-size: 11px; font-weight: 600;
      display: none; align-items: center; justify-content: center;
      line-height: 1;
    }
    .cart-badge.visible { display: flex; }
    .cart-badge.entering { animation: badge-enter 200ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    .cart-badge.popping  { animation: badge-pop 130ms ease; }

    /* ── Page ── */
    .page {
      max-width: 1160px;
      margin: 0 auto;
      padding: 88px 24px 80px;
    }

    .section-label {
      font-size: 11px; font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--text-muted);
    }

    /* ── Recipes ── */
    .recipes-section { margin-bottom: 44px; }
    .recipes-section .section-label { margin-bottom: 14px; }

    .recipes-strip {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .recipes-strip::-webkit-scrollbar { display: none; }

    .recipe-card {
      flex: 0 0 196px; width: 196px; height: 118px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      box-shadow: var(--shadow-card);
      padding: 16px;
      scroll-snap-align: start;
      cursor: pointer;
      display: flex; flex-direction: column; justify-content: space-between;
      transition: transform 200ms ease, box-shadow 200ms ease, border-color 150ms ease, border-width 0ms;
      user-select: none;
    }
    @media (hover: hover) {
      .recipe-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); }
    }
    .recipe-card:active { transform: scale(0.97) translateY(-1px); }
    .recipe-card.loaded { border: 2px solid var(--green-700); }

    .recipe-card-top {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
    }
    .recipe-name {
      font-family: var(--font-display);
      font-weight: 600; font-size: 15px;
      color: var(--text-primary);
      line-height: 1.25;
    }
    .recipe-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-top: 3px; }
    .recipe-check { font-size: 12px; font-weight: 600; color: var(--green-700); flex-shrink: 0; margin-top: 2px; }
    .recipe-card-bottom { display: flex; flex-direction: column; gap: 3px; }
    .recipe-vibe { font-size: 11px; font-style: italic; font-weight: 300; color: var(--text-muted); }
    .recipe-count { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-muted); }

    /* ── Workspace ── */
    .workspace { display: flex; gap: 28px; align-items: flex-start; }
    .ingredients-col { flex: 1 1 0; min-width: 0; }

    /* ── Ingredients Toggle (mobile only) ── */
    .ingredients-toggle {
      display: none;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      border-radius: 14px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-card);
      font-size: 14px; font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 12px;
    }
    .toggle-arrow {
      transition: transform 250ms ease;
      flex-shrink: 0;
      color: var(--text-muted);
    }
    .ingredients-toggle[aria-expanded="true"] .toggle-arrow {
      transform: rotate(180deg);
    }

    /* ── Category Tabs ── */
    .category-tabs {
      display: flex; gap: 8px;
      overflow-x: auto; scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      margin-bottom: 20px; padding-bottom: 2px;
    }
    .category-tabs::-webkit-scrollbar { display: none; }

    .cat-tab {
      flex: 0 0 auto;
      padding: 10px 16px;
      min-height: 44px;
      border-radius: 999px;
      font-size: 13px; font-weight: 500;
      color: var(--text-body);
      background: var(--bg-muted);
      transition: background 150ms ease, color 150ms ease;
      white-space: nowrap;
      display: flex; align-items: center;
    }
    @media (hover: hover) { .cat-tab:hover { background: var(--border-subtle); } }
    .cat-tab.active { background: var(--green-700); color: var(--text-on-green); }

    /* ── Ingredient Grid ── */
    .ingredient-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(176px, 1fr));
      gap: 12px;
      transition: opacity 100ms ease;
    }
    .ingredient-grid.fading { opacity: 0; }

    /* ── Ingredient Card ── */
    .ingredient-card {
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 13px 14px; min-height: 82px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      box-shadow: var(--shadow-card);
      cursor: pointer;
      text-align: left;
      transition: transform 180ms ease, box-shadow 180ms ease, background 150ms ease, border-color 150ms ease;
      opacity: 0;
    }
    .ingredient-card.visible { opacity: 1; }
    .ingredient-card.stagger { animation: stagger-in 280ms ease forwards; }

    @media (hover: hover) {
      .ingredient-card:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-lift);
        border-color: var(--border-strong);
      }
    }
    .ingredient-card.selecting { animation: card-select 200ms ease; }
    .ingredient-card.selected {
      background: var(--green-100);
      border: 1.5px solid var(--green-700);
    }
    @media (hover: hover) {
      .ingredient-card.selected:hover { border-color: var(--green-500); }
    }

    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
    .ingredient-name {
      font-size: 13px; font-weight: 600; color: var(--text-primary); line-height: 1.3;
      overflow-wrap: break-word; word-break: break-word;
    }

    .card-check {
      font-size: 12px; font-weight: 600; color: var(--green-700);
      opacity: 0; transition: opacity 150ms ease; flex-shrink: 0;
    }
    .ingredient-card.selected .card-check { opacity: 1; }

    .card-bottom { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 8px; }
    .ingredient-amount { font-size: 11px; font-weight: 300; color: var(--text-muted); }

    .price-pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
    .price-1 { background: var(--green-50);  color: var(--green-700); }
    .price-2 { background: var(--amber-100); color: var(--amber-500); }
    .price-3 { background: #FAE8E8;          color: #C0392B; }

    /* ── Cart Panel ── */
    .cart-panel {
      width: 296px; flex: 0 0 296px;
      position: sticky; top: 80px;
    }
    .cart-panel-inner {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 22px;
      box-shadow: var(--shadow-panel);
      padding: 22px;
    }

    .cart-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }
    .cart-title {
      font-family: var(--font-display);
      font-weight: 600; font-size: 20px;
      color: var(--text-primary);
    }
    .cart-count-badge {
      background: var(--green-700); color: var(--text-on-green);
      font-size: 12px; font-weight: 600;
      padding: 3px 11px; border-radius: 999px;
    }

    .budget-block {
      background: var(--bg-muted); border-radius: 12px;
      padding: 13px 15px; margin-bottom: 18px;
    }
    .budget-block .section-label { margin-bottom: 4px; }
    .budget-amount { font-size: 22px; font-weight: 600; color: var(--green-900); }

    .cart-list {
      display: flex; flex-direction: column;
      max-height: 300px; overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border-subtle) transparent;
    }
    .cart-list::-webkit-scrollbar { width: 3px; }
    .cart-list::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 2px; }

    .cart-row {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-subtle);
    }
    .cart-row:last-child { border-bottom: none; }
    .cart-row.entering { animation: slide-in 200ms ease-out; }
    .cart-row.leaving  { animation: slide-out 160ms ease-in forwards; }

    .cart-item-name   { font-size: 13px; font-weight: 600; color: var(--text-primary); line-height: 1.25; }
    .cart-item-amount { font-size: 11px; font-weight: 300; color: var(--text-muted); margin-top: 2px; }

    .cart-remove-btn {
      position: relative; flex-shrink: 0;
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-size: 16px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      transition: background 140ms ease, color 140ms ease, border-color 140ms ease;
    }
    .cart-remove-btn::after {
      content: ''; position: absolute; inset: -8px;
    }
    @media (hover: hover) {
      .cart-remove-btn:hover { background: #FAE8E8; color: #C0392B; border-color: #e0a0a0; }
    }

    .cart-empty {
      text-align: center; padding: 24px 0;
      color: var(--text-muted);
    }
    .cart-empty svg { margin: 0 auto 12px; display: block; }
    .cart-empty p { font-size: 13px; font-style: italic; font-weight: 300; }

    .cart-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }

    .btn {
      height: 44px; border-radius: 12px;
      font-size: 14px; font-weight: 600;
      font-family: var(--font-body);
      transition: background 140ms ease, color 140ms ease;
      cursor: pointer;
    }
    .btn-primary { background: var(--green-700); color: var(--text-on-green); border: none; }
    .btn-primary:hover { background: var(--green-500); }
    .btn-secondary {
      background: transparent; color: var(--text-muted);
      border: 1px solid var(--border-subtle);
    }
    .btn-secondary:hover { background: var(--bg-muted); color: var(--text-body); }
    .btn-export {
      background: var(--green-50); color: var(--green-700);
      border: 1.5px solid var(--green-100);
      font-size: 13px;
    }
    .btn-export:hover { background: var(--green-100); }

    /* ── Cart bottom bar (tablet/mobile only) ── */
    .cart-tab-bar { display: none; }

    .cart-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(26, 51, 40, 0.35);
      backdrop-filter: blur(2px);
      z-index: 90;
    }
    .cart-overlay.visible { display: block; }

    /* ── Responsive: tablet + mobile ── */
    @media (max-width: 899px) {
      .page { padding-bottom: 82px; }
      .workspace { flex-direction: column; align-items: stretch; }

      /* Recipe strip → 3-column grid */
      .recipes-strip {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        overflow-x: visible;
        scroll-snap-type: none;
        gap: 10px;
        padding-bottom: 0;
      }
      .recipe-card {
        flex: none;
        width: auto;
        height: auto;
        min-height: 88px;
        padding: 12px;
      }
      .recipe-name { font-size: 13px; }

      /* Ingredients toggle */
      .ingredients-toggle { display: flex; }
      .ingredients-body {
        overflow: hidden;
        max-height: 0;
        transition: max-height 320ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      .ingredients-body.expanded { max-height: 9999px; }

      /* Cart panel: fixed to bottom, slides up on expand */
      .cart-panel {
        position: fixed;
        top: auto;
        bottom: 0; left: 0; right: 0;
        width: 100%; flex: none;
        height: 68vh; height: 68dvh;
        z-index: 100;
        overflow: hidden;
        transform: translateY(calc(100% - 58px));
        transform: translateY(calc(100% - 58px - env(safe-area-inset-bottom, 0px)));
        transition: transform 300ms cubic-bezier(0.32, 0.72, 0, 1);
      }
      .cart-panel.expanded { transform: translateY(0); }

      .cart-tab-bar {
        display: flex;
        align-items: center; justify-content: space-between;
        height: 58px;
        background: var(--green-700);
        color: var(--text-on-green);
        padding: 0 22px;
        padding-bottom: env(safe-area-inset-bottom, 0px);
        height: calc(58px + env(safe-area-inset-bottom, 0px));
        border-radius: 20px 20px 0 0;
        cursor: pointer;
        flex-shrink: 0;
      }
      .cart-tab-bar-label { font-size: 15px; font-weight: 600; }
      .cart-tab-bar-info  { font-size: 13px; opacity: 0.8; }

      .cart-panel-inner {
        display: flex;
        flex-direction: column;
        height: calc(68vh - 58px); height: calc(68dvh - 58px);
        overflow: hidden;
        border-radius: 0;
        border: none;
        box-shadow: none;
        border-top: 1px solid var(--border-subtle);
      }

      .cart-header,
      .budget-block { flex-shrink: 0; }

      .cart-list {
        flex: 1 1 0;
        max-height: none;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
      }

      .cart-empty { flex-shrink: 0; }

      .cart-actions {
        flex-shrink: 0;
        margin-top: 12px;
        padding-bottom: 16px;
      }
    }

    /* ── Responsive: mobile only ── */
    @media (max-width: 599px) {
      .page {
        padding: 76px 14px 82px;
        padding-bottom: max(82px, calc(58px + env(safe-area-inset-bottom, 0px) + 24px));
      }
      .site-header { padding: 0 16px; }

      /* Recipe cards: slightly more compact on small phones */
      .recipe-card { padding: 10px; min-height: 76px; }
      .recipe-name { font-size: 12px; }
      .recipe-vibe { font-size: 9px; }
      .recipe-count { font-size: 9px; }

      /* 2-column ingredient grid with slightly tighter spacing */
      .ingredient-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .ingredient-card { padding: 11px 12px; min-height: 76px; }
      .ingredient-name { font-size: 12px; }
      .ingredient-amount { font-size: 10px; }

      /* Taller cart panel on small phones */
      .cart-panel { height: 78vh; height: 78dvh; }
      .cart-panel-inner { height: calc(78vh - 58px); height: calc(78dvh - 58px); }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <a class="wordmark" href="#">blend.</a>
    <button class="cart-btn" id="cart-btn" aria-label="Warenkorb öffnen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <path d="M16 10a4 4 0 0 1-8 0"/>
      </svg>
      <span class="cart-badge" id="cart-badge">0</span>
    </button>
  </header>

  <main class="page">

    <section class="recipes-section">
      <p class="section-label">Inspiration</p>
      <div class="recipes-strip" id="recipes-strip"></div>
    </section>

    <div class="workspace">

      <div class="ingredients-col">
        <button class="ingredients-toggle" id="ingredients-toggle" aria-expanded="false">
          <span>Zutaten anpassen</span>
          <svg class="toggle-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="ingredients-body" id="ingredients-body">
          <div class="category-tabs" id="category-tabs"></div>
          <div class="ingredient-grid" id="ingredient-grid"></div>
        </div>
      </div>

      <aside class="cart-panel" id="cart-panel">
        <div class="cart-tab-bar" id="cart-tab-bar">
          <span class="cart-tab-bar-label">Einkaufszettel</span>
          <span class="cart-tab-bar-info" id="cart-tab-info">0 Artikel</span>
        </div>
        <div class="cart-panel-inner">
          <div class="cart-header">
            <h2 class="cart-title">Einkaufszettel</h2>
            <span class="cart-count-badge" id="cart-count-badge">0</span>
          </div>
          <div class="budget-block">
            <p class="section-label">Geschätzte Kosten</p>
            <p class="budget-amount" id="budget-amount">ca. 12–18 €</p>
          </div>
          <div class="cart-list" id="cart-list"></div>
          <div class="cart-empty" id="cart-empty">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--green-100)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/>
              <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
            </svg>
            <p>Noch nichts ausgewählt.</p>
          </div>
          <div class="cart-actions">
            <button class="btn btn-primary" id="btn-starter">✨ Starter-Liste</button>
            <button class="btn btn-export" id="btn-export" style="display:none" aria-label="Einkaufsliste teilen">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:7px;vertical-align:-2px"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
              In Notizen speichern
            </button>
            <button class="btn btn-secondary" id="btn-reset">Zurücksetzen</button>
          </div>
        </div>
      </aside>

    </div>
  </main>

  <div class="cart-overlay" id="cart-overlay"></div>

  <script>
    /* ── DATA ── */
    const categories = [
      {
        name: "Basis & Sattmacher",
        items: [
          { name: "Haferflocken",            amount: "1 Packung",      price: "€"  },
          { name: "Bananen",                 amount: "8–10 Stück",     price: "€"  },
          { name: "Skyr oder Naturjoghurt",  amount: "500 g – 1 kg",   price: "€€" },
          { name: "Milch oder Hafermilch",   amount: "1–2 Liter",      price: "€"  },
          { name: "Erdnussmus",              amount: "1 Glas",         price: "€€" },
          { name: "Leinsamen oder Chiasamen",amount: "1 Packung",      price: "€€" },
          { name: "Kakao ungesüßt",          amount: "1 Packung",      price: "€"  }
        ]
      },
      {
        name: "Obst",
        items: [
          { name: "TK-Beerenmix",             amount: "1 große Packung", price: "€€" },
          { name: "TK-Mango oder TK-Ananas",  amount: "1 Packung",       price: "€€" },
          { name: "Äpfel",                    amount: "4–6 Stück",       price: "€"  },
          { name: "Zitronen oder Limetten",   amount: "3–4 Stück",       price: "€"  },
          { name: "Datteln",                  amount: "1 kleine Packung",price: "€€" }
        ]
      },
      {
        name: "Gemüse",
        items: [
          { name: "Babyspinat oder TK-Spinat", amount: "1 Packung", price: "€" },
          { name: "Karotten",                  amount: "1 kg",       price: "€" },
          { name: "Gurke",                     amount: "1 Stück",    price: "€" },
          { name: "Gekochte Rote Bete",        amount: "1 Packung",  price: "€" }
        ]
      },
      {
        name: "Geschmack & Extras",
        items: [
          { name: "Ingwer",   amount: "1 kleines Stück", price: "€" },
          { name: "Zimt",     amount: "1 Dose",          price: "€" },
          { name: "Kurkuma",  amount: "1 Dose",          price: "€" }
        ]
      }
    ];

    const recipes = [
      {
        name: "Sattmacher Shake",
        vibe: "cremig, günstig, Frühstück-tauglich",
        color: "#C8A96E",
        ingredients: ["Haferflocken", "Bananen", "Milch oder Hafermilch", "Erdnussmus", "Kakao ungesüßt"]
      },
      {
        name: "Berry Protein",
        vibe: "fruchtig, proteinreich, easy",
        color: "#9B6EA8",
        ingredients: ["TK-Beerenmix", "Bananen", "Skyr oder Naturjoghurt", "Milch oder Hafermilch", "Haferflocken"]
      },
      {
        name: "Green Glow",
        vibe: "frisch, gesund, nicht zu herb",
        color: "#4A9B6F",
        ingredients: ["Babyspinat oder TK-Spinat", "Bananen", "Äpfel", "Zitronen oder Limetten"]
      },
      {
        name: "Mango Karotte",
        vibe: "tropisch, frisch, vitaminreich",
        color: "#E07B39",
        ingredients: ["TK-Mango oder TK-Ananas", "Karotten", "Bananen", "Ingwer"]
      },
      {
        name: "Detox Grün",
        vibe: "entgiftend, leicht, erfrischend",
        color: "#5BAD72",
        ingredients: ["Babyspinat oder TK-Spinat", "Gurke", "Äpfel", "Zitronen oder Limetten", "Ingwer"]
      },
      {
        name: "Golden Glow",
        vibe: "entzündungshemmend, warm, kraftvoll",
        color: "#D4A017",
        ingredients: ["Karotten", "Bananen", "Kurkuma", "Ingwer", "Milch oder Hafermilch"]
      },
      {
        name: "Schoko Power",
        vibe: "schokoladig, sättigend, Nervennahrung",
        color: "#6B3A2A",
        ingredients: ["Kakao ungesüßt", "Bananen", "Erdnussmus", "Haferflocken", "Milch oder Hafermilch"]
      },
      {
        name: "Rote Bete Boost",
        vibe: "kräftig, süßlich, ausdauerfördernd",
        color: "#A0264A",
        ingredients: ["Gekochte Rote Bete", "Äpfel", "Zitronen oder Limetten", "Ingwer"]
      },
      {
        name: "Tropical Vibes",
        vibe: "tropisch, süß, sommerlich",
        color: "#F0A500",
        ingredients: ["TK-Mango oder TK-Ananas", "Bananen", "Milch oder Hafermilch", "Datteln"]
      },
      {
        name: "Chia Power",
        vibe: "ballaststoffreich, leicht, nachhaltig satt",
        color: "#7B9EA6",
        ingredients: ["Leinsamen oder Chiasamen", "TK-Beerenmix", "Bananen", "Skyr oder Naturjoghurt"]
      }
    ];

    const starterItems = new Set([
      "Haferflocken", "Bananen", "Skyr oder Naturjoghurt", "Milch oder Hafermilch",
      "Erdnussmus", "TK-Beerenmix", "Äpfel", "Babyspinat oder TK-Spinat"
    ]);

    /* ── STATE ── */
    const state = { selected: {}, activeCategory: 'all' };

    categories.forEach(cat => cat.items.forEach(item => {
      state.selected[item.name] = starterItems.has(item.name);
    }));

    /* ── LOCALSTORAGE ── */
    function saveState() {
      try { localStorage.setItem('blend-selected', JSON.stringify(state.selected)); } catch(e) {}
    }

    function loadState() {
      try {
        const saved = localStorage.getItem('blend-selected');
        if (!saved) return;
        const parsed = JSON.parse(saved);
        Object.keys(state.selected).forEach(key => {
          if (Object.prototype.hasOwnProperty.call(parsed, key)) state.selected[key] = parsed[key];
        });
      } catch(e) {}
    }

    loadState();

    /* ── HELPERS ── */
    function getSelectedItems() {
      return categories.flatMap(cat =>
        cat.items.filter(i => state.selected[i.name]).map(i => ({ ...i, category: cat.name }))
      );
    }

    function computeBudget(items) {
      const score = items.reduce((s, i) => s + i.price.length, 0);
      if (score <= 9)  return "ca. 12–18 €";
      if (score <= 15) return "ca. 18–28 €";
      return "ca. 28–40 €";
    }

    function getFilteredItems(cat) {
      if (cat === 'all') return categories.flatMap(c => c.items);
      const found = categories.find(c => c.name === cat);
      return found ? found.items : [];
    }

    function priceClass(price) {
      return price === '€' ? 'price-1' : price === '€€' ? 'price-2' : 'price-3';
    }

    function isRecipeLoaded(recipe) {
      return recipe.ingredients.every(n => state.selected[n]);
    }

    /* ── RENDER: Recipe Strip ── */
    function renderRecipeStrip() {
      const strip = document.getElementById('recipes-strip');
      strip.innerHTML = '';
      recipes.forEach(recipe => {
        const loaded = isRecipeLoaded(recipe);
        const card = document.createElement('div');
        card.className = 'recipe-card' + (loaded ? ' loaded' : '');
        card.dataset.recipe = recipe.name;
        card.innerHTML = `
          <div class="recipe-card-top">
            <span class="recipe-name">${recipe.name}</span>
            ${loaded
              ? `<span class="recipe-check">✓</span>`
              : `<span class="recipe-dot" style="background:${recipe.color}"></span>`}
          </div>
          <div class="recipe-card-bottom">
            <span class="recipe-vibe">${recipe.vibe}</span>
            <span class="recipe-count">${recipe.ingredients.length} Zutaten</span>
          </div>`;
        card.addEventListener('click', () => toggleRecipe(recipe.name));
        strip.appendChild(card);
      });
    }

    function updateRecipeCard(recipeName) {
      const recipe = recipes.find(r => r.name === recipeName);
      if (!recipe) return;
      const card = document.querySelector(`.recipe-card[data-recipe="${CSS.escape(recipeName)}"]`);
      if (!card) return;
      const loaded = isRecipeLoaded(recipe);
      card.classList.toggle('loaded', loaded);
      const indicator = card.querySelector('.recipe-check, .recipe-dot');
      if (indicator) {
        indicator.outerHTML = loaded
          ? `<span class="recipe-check">✓</span>`
          : `<span class="recipe-dot" style="background:${recipe.color}"></span>`;
      }
    }

    /* ── RENDER: Category Tabs ── */
    function renderCategoryTabs() {
      const container = document.getElementById('category-tabs');
      container.innerHTML = '';
      const tabs = [{ key: 'all', label: 'Alle' }, ...categories.map(c => ({ key: c.name, label: c.name }))];
      tabs.forEach(tab => {
        const btn = document.createElement('button');
        btn.className = 'cat-tab' + (state.activeCategory === tab.key ? ' active' : '');
        btn.textContent = tab.label;
        btn.addEventListener('click', () => {
          if (state.activeCategory === tab.key) return;
          state.activeCategory = tab.key;
          document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
          btn.classList.add('active');
          renderIngredientGrid(tab.key);
        });
        container.appendChild(btn);
      });
    }

    /* ── RENDER: Ingredient Grid ── */
    function renderIngredientGrid(category) {
      const grid = document.getElementById('ingredient-grid');
      grid.classList.add('fading');
      setTimeout(() => {
        grid.innerHTML = '';
        getFilteredItems(category).forEach((item, i) => {
          const card = buildIngredientCard(item);
          card.classList.add('stagger');
          card.style.animationDelay = `${i * 28}ms`;
          grid.appendChild(card);
        });
        grid.classList.remove('fading');
      }, 110);
    }

    function buildIngredientCard(item) {
      const card = document.createElement('button');
      card.className = 'ingredient-card' + (state.selected[item.name] ? ' selected' : '');
      card.dataset.ingredient = item.name;
      card.setAttribute('aria-pressed', state.selected[item.name] ? 'true' : 'false');
      card.innerHTML = `
        <div class="card-top">
          <span class="ingredient-name">${item.name}</span>
          <span class="card-check" aria-hidden="true">✓</span>
        </div>
        <div class="card-bottom">
          <span class="ingredient-amount">${item.amount}</span>
          <span class="price-pill ${priceClass(item.price)}">${item.price}</span>
        </div>`;
      card.addEventListener('click', () => toggleItem(item.name));
      return card;
    }

    /* ── TARGETED DOM UPDATES ── */
    function updateIngredientCard(name) {
      const card = document.querySelector(`.ingredient-card[data-ingredient="${CSS.escape(name)}"]`);
      if (!card) return;
      const sel = state.selected[name];
      card.classList.toggle('selected', sel);
      card.setAttribute('aria-pressed', sel ? 'true' : 'false');
      card.classList.remove('selecting');
      void card.offsetWidth;
      card.classList.add('selecting');
      card.addEventListener('animationend', () => card.classList.remove('selecting'), { once: true });
    }

    function updateCartPanel() {
      const items = getSelectedItems();
      const listEl   = document.getElementById('cart-list');
      const emptyEl  = document.getElementById('cart-empty');
      const countBadge = document.getElementById('cart-count-badge');
      const budgetEl = document.getElementById('budget-amount');
      const tabInfo  = document.getElementById('cart-tab-info');

      const count = items.length;
      countBadge.textContent = count;
      const budget = computeBudget(items);
      budgetEl.textContent = budget;
      if (tabInfo) tabInfo.textContent = `${count} Artikel — ${budget}`;

      if (count === 0) {
        listEl.querySelectorAll('.cart-row').forEach(row => {
          row.classList.add('leaving');
          row.addEventListener('animationend', () => row.remove(), { once: true });
        });
        emptyEl.style.display = '';
        return;
      }

      emptyEl.style.display = 'none';

      const currentNames = new Set([...listEl.querySelectorAll('.cart-row')].map(r => r.dataset.cartItem));
      const selectedNames = new Set(items.map(i => i.name));

      listEl.querySelectorAll('.cart-row').forEach(row => {
        if (!selectedNames.has(row.dataset.cartItem)) {
          row.classList.add('leaving');
          row.addEventListener('animationend', () => row.remove(), { once: true });
        }
      });

      items.forEach(item => {
        if (!currentNames.has(item.name)) {
          const row = document.createElement('div');
          row.className = 'cart-row entering';
          row.dataset.cartItem = item.name;
          row.innerHTML = `
            <div>
              <p class="cart-item-name">${item.name}</p>
              <p class="cart-item-amount">${item.amount}</p>
            </div>
            <button class="cart-remove-btn" aria-label="${item.name} entfernen">−</button>`;
          row.querySelector('.cart-remove-btn').addEventListener('click', e => {
            e.stopPropagation();
            toggleItem(item.name);
          });
          row.addEventListener('animationend', () => row.classList.remove('entering'), { once: true });
          listEl.appendChild(row);
        }
      });
    }

    function updateHeaderBadge() {
      const count = getSelectedItems().length;
      const badge = document.getElementById('cart-badge');
      if (count === 0) {
        badge.classList.remove('visible', 'popping', 'entering');
      } else {
        const wasVisible = badge.classList.contains('visible');
        badge.textContent = count;
        if (!wasVisible) {
          badge.classList.add('visible', 'entering');
          badge.addEventListener('animationend', () => badge.classList.remove('entering'), { once: true });
        } else {
          badge.classList.remove('popping');
          void badge.offsetWidth;
          badge.classList.add('popping');
          badge.addEventListener('animationend', () => badge.classList.remove('popping'), { once: true });
        }
      }
      const btn = document.getElementById('cart-btn');
      btn.classList.remove('shaking');
      void btn.offsetWidth;
      btn.classList.add('shaking');
      btn.addEventListener('animationend', () => btn.classList.remove('shaking'), { once: true });
    }

    /* ── ACTIONS ── */
    function toggleItem(name) {
      state.selected[name] = !state.selected[name];
      updateIngredientCard(name);
      updateCartPanel();
      updateHeaderBadge();
      recipes.forEach(r => { if (r.ingredients.includes(name)) updateRecipeCard(r.name); });
      saveState();
    }

    function toggleRecipe(name) {
      const recipe = recipes.find(r => r.name === name);
      if (!recipe) return;
      const allLoaded = isRecipeLoaded(recipe);
      recipe.ingredients.forEach(n => { state.selected[n] = !allLoaded; });
      recipe.ingredients.forEach(n => updateIngredientCard(n));
      updateCartPanel();
      updateHeaderBadge();
      updateRecipeCard(name);
      saveState();
    }

    function selectStarter() {
      categories.forEach(cat => cat.items.forEach(item => {
        state.selected[item.name] = starterItems.has(item.name);
      }));
      document.getElementById('cart-list').innerHTML = '';
      renderIngredientGrid(state.activeCategory);
      updateCartPanel();
      updateHeaderBadge();
      renderRecipeStrip();
      saveState();
    }

    function clearAll() {
      categories.forEach(cat => cat.items.forEach(item => { state.selected[item.name] = false; }));
      document.getElementById('cart-list').innerHTML = '';
      renderIngredientGrid(state.activeCategory);
      updateCartPanel();
      updateHeaderBadge();
      renderRecipeStrip();
      saveState();
    }

    /* ── IOS EXPORT ── */
    async function exportToNotes() {
      const items = getSelectedItems();
      if (items.length === 0) return;
      const text = 'Einkaufsliste blend.\n\n' +
        items.map(i => `• ${i.name} (${i.amount})`).join('\n') +
        `\n\n${computeBudget(items)}`;
      try {
        await navigator.share({ title: 'Einkaufsliste blend.', text });
      } catch(e) {}
    }

    /* ── MOBILE CART ── */
    let cartExpanded = false;

    function toggleCart() {
      cartExpanded = !cartExpanded;
      document.getElementById('cart-panel').classList.toggle('expanded', cartExpanded);
      document.getElementById('cart-overlay').classList.toggle('visible', cartExpanded);
    }

    document.getElementById('cart-tab-bar').addEventListener('click', toggleCart);
    document.getElementById('cart-btn').addEventListener('click', () => {
      if (window.innerWidth < 900) toggleCart();
    });
    document.getElementById('cart-overlay').addEventListener('click', () => {
      if (cartExpanded) toggleCart();
    });

    document.getElementById('btn-starter').addEventListener('click', selectStarter);
    document.getElementById('btn-reset').addEventListener('click', clearAll);
    document.getElementById('btn-export').addEventListener('click', exportToNotes);

    /* ── INGREDIENTS TOGGLE ── */
    document.getElementById('ingredients-toggle').addEventListener('click', () => {
      const body = document.getElementById('ingredients-body');
      const btn  = document.getElementById('ingredients-toggle');
      const expanded = body.classList.toggle('expanded');
      btn.setAttribute('aria-expanded', expanded);
    });

    /* ── INIT ── */
    if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
      document.getElementById('btn-export').style.display = '';
    }

    renderRecipeStrip();
    renderCategoryTabs();
    renderIngredientGrid('all');
    updateCartPanel();
    updateHeaderBadge();
  </script>
</body>
</html>
